[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexter-toolkit"
version = "2.0.0"
description = "Data Experimentation and Tinkering Kit - a small toolkit for optimization, simulation, statistics, visualization and model selection experiments"
readme = "README.md"
authors = [{ name = "Deniz", email = "denizkurtaran00@gmail.com" }]
license = "MIT"
keywords = ["data-science", "machine-learning", "optimization", "simulation", "visualization", "statistics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.5",
    "plotly>=5.9.0",
    "pyomo>=6.7",
    "scipy>=1.10",
    "simpy>=4.1.1",
    "sympy>=1.12",
]

[project.optional-dependencies]
ml = [
    "hyperopt>=0.2.7",
    "matplotlib>=3.7",
    "scikit-learn>=1.2.2",
    "seaborn>=0.13.2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
]

[project.urls]
"Homepage" = "https://github.com/DenizK00/Dexter"
"Repository" = "https://github.com/DenizK00/Dexter.git"
"Bug Tracker" = "https://github.com/DenizK00/Dexter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.pytest.ini_options]
testpaths = ["tests"]
